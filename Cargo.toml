[workspace]
resolver = "3"
members = ["kernel"]

# Root package: builds the bootable UEFI disk image from the kernel artifact.
# `cargo build` at the workspace root produces target/<profile>/trios-uefi.img
[package]
name = "trios"
version = "0.1.0"
edition = "2024"
description = "TriOS — a hobby OS merging the best of Windows, Linux and Android"
license = "MIT"

[build-dependencies]
# Artifact dependency: cargo builds the kernel crate for x86_64-unknown-none
# and exposes the resulting ELF path via CARGO_BIN_FILE_KERNEL_kernel.
kernel = { path = "kernel", artifact = "bin", target = "x86_64-unknown-none" }
# UEFI-only image creation; the BIOS path is out of scope for TriOS.
bootloader = { version = "0.11", default-features = false, features = ["uefi"] }
